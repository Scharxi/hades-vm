[package]
name = "hades-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
hades-ir = { path = "../hades-ir" }
vm = { path = "../vm" }
nyx-compiler = { path = "../nyx-compiler" }
clap = { version = "4.5.1", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
tempfile = "3.7.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
assert_fs = "1.0"
predicates = "3.0"