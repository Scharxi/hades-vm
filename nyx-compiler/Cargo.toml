[package]
name = "nyx-compiler"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Kotlin-like language compiler for Hades VM"
license = "MIT"
repository = "https://github.com/yourusername/nyx-compiler"

[dependencies]
# Core dependencies
thiserror = "1.0"  # For error handling
log = "0.4"        # For logging
env_logger = "0.10" # For logging setup
vm = { path = "../vm" }
hades-ir = { path = "../hades-ir" }
logos = "0.14"
chumsky = "0.9"
indexmap = "2.1"

[dev-dependencies]
pretty_assertions = "1.4"  # For better test assertions
tempfile = "3.8"  # For creating temporary files in tests 